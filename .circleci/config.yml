# CircleCI pipeline for xai-grok-pager (the Grok Build TUI).
#
# Builds the two non-Windows targets on native runners:
#   - Linux   : x86_64-unknown-linux-gnu   (ubuntu container)
#   - macOS   : aarch64-apple-darwin        (Apple Silicon mac)
#
# Windows (x86_64-pc-windows-msvc) is built out-of-band; it needs the
# PROTOC env workaround documented in AGENTS.md.
#
# protoc: bin/protoc in this repo is a dotslash wrapper (no dotslash on CI),
# so we download a real protoc 29.3 for the platform and set $PROTOC, which
# crates/build/xai-proto-build/src/find_protoc.rs checks before bin/protoc.
#
# Build profile is a pipeline parameter (default "size-opt" -> ~131 MB binary).
# Set it to "release" to use the default shipping profile instead.
version: 2.1

parameters:
  build_profile:
    type: string
    default: "size-opt"

executors:
  linux-x86_64:
    docker:
      # rustup auto-installs the version pinned in rust-toolchain.toml (1.96.0)
      # if this image's default differs.
      - image: cimg/rust:1.94.1
    resource_class: large # 4 vCPU / 8 GB (xlarge is paid-only; not on the Free plan)
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

  macos-arm64:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium # Apple Silicon (M4 Pro)
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

commands:
  install-system-deps:
    steps:
      - run:
          name: Install Linux build dependencies
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake pkg-config build-essential unzip libasound2-dev
      - run:
          name: Add swapfile (large = 8 GB RAM)
          command: |
            set -euo pipefail
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            free -h

  install-protoc:
    steps:
      - run:
          name: Download and install protoc 29.3
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            case "$(uname -s)/$(uname -m)" in
              Linux/x86_64) url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" ;;
              Darwin/arm64) url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip" ;;
              *) echo "unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "$url" -o /tmp/protoc.zip
            unzip -q /tmp/protoc.zip -d /tmp/protoc
            sudo cp /tmp/protoc/bin/protoc /usr/local/bin/protoc
            # find_protoc checks $PROTOC first, short-circuiting the dotslash wrapper.
            echo 'export PROTOC=/usr/local/bin/protoc' >> "$BASH_ENV"
            protoc --version

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target

jobs:
  build-linux:
    executor: linux-x86_64
    steps:
      - checkout
      - install-system-deps
      - install-protoc
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (Linux x86_64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> -j 2
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/xai-grok-pager
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/xai-grok-pager
          destination: xai-grok-pager-linux-x86_64
      - save-cargo-cache

  build-macos:
    executor: macos-arm64
    steps:
      - checkout
      - run:
          name: Install Rust toolchain (rustup)
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - install-protoc
      - run:
          name: Install cmake if missing
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            if ! command -v cmake >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
            fi
            cmake --version
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (macOS arm64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> -j 4
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/xai-grok-pager
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/xai-grok-pager
          destination: xai-grok-pager-macos-arm64
      - save-cargo-cache

workflows:
  version: 2
  build:
    jobs:
      - build-linux
      - build-macos
