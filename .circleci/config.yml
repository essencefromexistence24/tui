# CircleCI pipeline for xai-grok-pager (the Grok Build TUI).
#
# Builds on two native runners:
#   - macOS : aarch64-apple-darwin  (Apple Silicon, primary)
#   - Linux : x86_64-unknown-linux-gnu (ubuntu container)
#
# protoc: bin/protoc in this repo is a dotslash wrapper (no dotslash on CI),
# so we download a real protoc 29.3 for the platform and set $PROTOC, which
# crates/build/xai-proto-build/src/find_protoc.rs checks before bin/protoc.
#
# Build profile is a pipeline parameter (default "size-opt").
# Set it to "release" to use the default shipping profile instead.
version: 2.1

parameters:
  build_profile:
    type: string
    default: "size-opt"

executors:
  macos-aarch64:
    macos:
      xcode: "16.2.0"
    resource_class: macos.m1.large.gen1  # 8 vCPU / 12 GB - Apple Silicon
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

  linux-x86_64:
    docker:
      # rustup auto-installs the version pinned in rust-toolchain.toml (1.94.0)
      # if this image's default differs.
      - image: cimg/rust:1.94.0
    resource_class: xlarge # 8 vCPU / 16 GB - this dep tree needs the RAM
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

commands:
  install-linux-deps:
    steps:
      - run:
          name: Install Linux build dependencies
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake pkg-config build-essential unzip \
              libasound2-dev

  install-macos-deps:
    steps:
      - run:
          name: Install macOS build dependencies
          command: |
            set -euo pipefail
            # cmake and pkg-config may already be present on the Xcode image;
            # brew install is a no-op if the formula is already installed.
            brew install cmake pkg-config

  install-protoc:
    steps:
      - run:
          name: Download and install protoc 29.3
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            case "$(uname -s)/$(uname -m)" in
              Linux/x86_64)  url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" ;;
              Darwin/arm64)  url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip" ;;
              Darwin/x86_64) url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-x86_64.zip" ;;
              *) echo "unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "$url" -o /tmp/protoc.zip
            unzip -q /tmp/protoc.zip -d /tmp/protoc
            sudo cp /tmp/protoc/bin/protoc /usr/local/bin/protoc
            # find_protoc checks $PROTOC first, short-circuiting the dotslash wrapper.
            echo 'export PROTOC=/usr/local/bin/protoc' >> "$BASH_ENV"
            protoc --version

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target

jobs:
  build-macos:
    executor: macos-aarch64
    steps:
      - checkout
      - install-macos-deps
      - install-protoc
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (macOS aarch64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> -j 8
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/xai-grok-pager
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/xai-grok-pager
          destination: xai-grok-pager-macos-aarch64
      - save-cargo-cache

  build-linux:
    executor: linux-x86_64
    steps:
      - checkout
      - install-linux-deps
      - install-protoc
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (Linux x86_64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> -j 6
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/xai-grok-pager
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/xai-grok-pager
          destination: xai-grok-pager-linux-x86_64
      - save-cargo-cache

workflows:
  version: 2
  build:
    jobs:
      - build-macos
      - build-linux
