# CircleCI pipeline for xai-grok-pager (the Dx TUI binary).
#
# Currently macOS-only: Windows and Linux are built locally
# (`just build`, `just build-linux`) and already shipped.
#   - macOS   : aarch64, m4pro.medium (6 vCPU / 28 GiB, free-plan eligible)
#
# (The build-linux job definition is kept below for when cloud Linux builds
# are needed again; it is just not in the workflow right now.)
#
# Free-plan budget (verified 2026-09-04): macOS M4 Pro Medium costs
# 200 credits/min out of the 30,000/month pool, and Free jobs hard-cap at
# 1 hour total. A cold mac build (~45-60 min + setup) barely fits, so never
# break the restore/save cache steps: without a warm cache every build stays
# cold and risks hitting the cap forever. Roughly two full mac builds/month.
# Linux machine time costs an order of magnitude less per minute.
# Keep the cargo cache warm (save/restore below) so rebuilds stay incremental.
#
# Runner pin: Xcode 26.4.1 is a supported image on m4pro.medium (newest is
# 27.0; we stay on 26.4.1 because earlier macOS runs prove it). m4pro.medium
# is the Free-plan default; M1/M2 classes are end-of-life since Feb 2026 and
# must not be referenced (configs using them fail to parse).
#
# protoc: bin/protoc in this repo is a dotslash wrapper (no dotslash on CI),
# so we download a real protoc 29.3 for the platform and set $PROTOC, which
# crates/build/xai-proto-build/src/find_protoc.rs checks before bin/protoc.
#
# Parameters (Trigger Pipeline UI or API):
#   build_profile  - "size-opt" (default, ~170 MB) or "release" (~292 MB)
#   pager_features - extra cargo features, e.g. "channels-heavy" for the
#                    matrix/wechat/whatsapp-web/voice build (~340 MB).
#                    Empty = lean default channel set.
version: 2.1

parameters:
  build_profile:
    type: string
    default: "size-opt"
  pager_features:
    type: string
    default: ""

executors:
  linux-x86_64:
    machine:
      image: ubuntu-2404:current
    resource_class: xlarge.gen2 # 8 vCPU / 32 GiB - Gen2 Linux VM, free plan
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

  macos-aarch64:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium # 6 vCPU / 28 GiB - free plan eligible
    working_directory: ~/repo
    environment:
      BASH_ENV: /tmp/BASH_ENV

commands:
  install-linux-deps:
    steps:
      - run:
          name: Install Linux build dependencies
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              cmake pkg-config build-essential unzip \
              libasound2-dev
            # Machine executor does not ship Rust; install via rustup
            # (rust-toolchain.toml pins the exact version).
            if ! command -v rustup &>/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            fi
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"

  install-macos-deps:
    steps:
      - run:
          name: Install macOS build dependencies
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            # Install rustup if not already present
            if ! command -v rustup &>/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            fi
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install cmake pkgconf

  install-protoc:
    steps:
      - run:
          name: Download and install protoc 29.3
          command: |
            set -euo pipefail
            touch "$BASH_ENV"
            case "$(uname -s)/$(uname -m)" in
              Linux/x86_64)  url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" ;;
              Darwin/arm64)  url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip" ;;
              Darwin/x86_64) url="https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-x86_64.zip" ;;
              *) echo "unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL "$url" -o /tmp/protoc.zip
            unzip -q /tmp/protoc.zip -d /tmp/protoc
            sudo cp /tmp/protoc/bin/protoc /usr/local/bin/protoc
            # find_protoc checks $PROTOC first, short-circuiting the dotslash wrapper.
            echo 'export PROTOC=/usr/local/bin/protoc' >> "$BASH_ENV"
            protoc --version

  restore-cargo-cache:
    steps:
      - restore_cache:
          keys:
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-

  save-cargo-cache:
    steps:
      - save_cache:
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target

jobs:
  build-linux:
    executor: linux-x86_64
    steps:
      - checkout
      - install-linux-deps
      - install-protoc
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (Linux x86_64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            FEATURES="<< pipeline.parameters.pager_features >>"
            EXTRA=""; if [ -n "$FEATURES" ]; then EXTRA="--features $FEATURES"; fi
            # shellcheck disable=SC2086
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> $EXTRA -j 6
      - save_cache:
          # Keep compiled deps even on OOM so the next run resumes instead of restarting.
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          when: on_fail
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/dx-tui
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/dx-tui
          destination: dx-tui-linux-x86_64
      - save-cargo-cache

  build-macos:
    executor: macos-aarch64
    steps:
      - checkout
      - install-macos-deps
      - install-protoc
      - restore-cargo-cache
      - run:
          name: Build xai-grok-pager (macOS arm64)
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            rustc --version && cargo --version
            FEATURES="<< pipeline.parameters.pager_features >>"
            EXTRA=""; if [ -n "$FEATURES" ]; then EXTRA="--features $FEATURES"; fi
            # shellcheck disable=SC2086
            cargo build -p xai-grok-pager-bin --profile << pipeline.parameters.build_profile >> $EXTRA -j 6
      - save_cache:
          # Keep compiled deps even on OOM so the next run resumes instead of restarting.
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Branch }}
          when: on_fail
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ./target
      - run:
          name: Report binary size
          command: |
            ls -lh target/<< pipeline.parameters.build_profile >>/dx-tui
      - store_artifacts:
          path: target/<< pipeline.parameters.build_profile >>/dx-tui
          destination: dx-tui-macos-arm64
      - save-cargo-cache

workflows:
  version: 2
  build:
    jobs:
      - build-macos
