[package]
name = "dx-plugin-runtime"
version = "1.0.0"
edition = "2021"
description = "JavaScript plugin runtime for Dx editor"

[dependencies]
rquickjs = { version = "0.11", features = ["futures", "macro"] }
rquickjs-serde = "0.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
dx-core = { path = "../core", features = ["plugins"] }
dx-parser-js = { path = "../parser-js" }
jsonc-parser = { version = "0.32", features = ["serde", "serde_json", "cst"] }
dx-plugin-api-macros = { path = "../plugin-api-macros" }
ts-rs = { version = "12.0", features = ["serde_json", "no-serde-warnings"] }
lsp-types = "0.97"
oxc_allocator = "0.128.0"
oxc_parser = "0.128.0"
oxc_codegen = { version = "0.128.0", default-features = false }
oxc_span = "0.128.0"
oxc_diagnostics = "0.128.0"
trash = "5.2.5"

# rquickjs-sys has no pre-generated bindings for FreeBSD
[target.'cfg(target_os = "freebsd")'.dependencies]
rquickjs = { version = "0.11", features = ["bindgen"] }

# rquickjs-sys has no pre-generated bindings for NetBSD
[target.'cfg(target_os = "netbsd")'.dependencies]
rquickjs = { version = "0.11", features = ["bindgen"] }
