[package]
name = "dx-core"
version = "1.0.0"
edition = "2021"
description = "Core types and utilities for the Dx editor"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
unicode-width = "0.2"
lsp-types = "0.97"
ts-rs = { version = "12.0", features = ["serde_json", "no-serde-warnings"] }
schemars = { version = "1.2", features = ["preserve_order"] }
rquickjs = { version = "0.11", features = ["futures", "macro"], optional = true }
rquickjs-serde = { version = "0.5", optional = true }

[dev-dependencies]
proptest = "1.9"

[features]
plugins = ["dep:rquickjs", "dep:rquickjs-serde"]
