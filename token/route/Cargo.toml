[workspace]
resolver = "2"
members = [
  "crates/dx-route-core",
  "crates/dx-route-lite",
  "crates/dx-route-caveman",
  "crates/dx-route-rtk",
  "crates/dx-route-ultra",
  "crates/dx-route-aggressive",
  "crates/dx-route-headroom",
  "crates/dx-route-dedup",
  "crates/dx-route-ccr",
  "crates/dx-route-storage",
  "crates/dx-route-cli",
  "crates/dx-route-mcp",
  "crates/dx-route-proxy",
  "crates/dx-route-benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/chanhdai/dx-route"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiktoken-rs = "0.6"
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP / server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
bytes = "1"

# Util
regex-lite = "0.1"
shellexpand = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
